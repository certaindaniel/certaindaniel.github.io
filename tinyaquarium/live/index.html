<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>TinyAquarium</title>
<link rel="canonical" href="/tinyaquarium/">
<meta name="robots" content="noindex">
<!-- /tinyaquarium/live/ 曾經是第二個首頁，已併回 /tinyaquarium/。
     這頁只負責把舊連結（App 內、外部分享、搜尋結果）帶到新位置，語系參數照傳。 -->
<script>
  (function () {
    var q = location.search || '';
    location.replace('/tinyaquarium/' + q + (location.hash || ''));
  })();
</script>
<meta http-equiv="refresh" content="0; url=/tinyaquarium/">
</head>
<body>
<p>已搬家到 <a href="/tinyaquarium/">/tinyaquarium/</a></p>
</body>
</html>
